name: token-udf

services:
  clickhouse:
    build:
      context: ..
      dockerfile: local/Dockerfile
      target: clickhouse
    environment:
      CLICKHOUSE_USER: benchmark
      CLICKHOUSE_PASSWORD: benchmark
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${CLICKHOUSE_TCP_PORT:-19000}:9000"
    cpuset: "${CLICKHOUSE_CPUSET:-}"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - type: bind
        source: ./user_scripts/count_tokens_main
        target: /opt/token-udfs/count_tokens_main
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./user_scripts/count_token_chrs
        target: /opt/token-udfs/count_token_chrs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./user_scripts/models.json
        target: /opt/token-udfs/models.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "benchmark", "--password", "benchmark", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  clickhouse-data:
